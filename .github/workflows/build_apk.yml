name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Regenerate Android, Add Permissions & Sign APK
        run: |
          rm -rf android/
          flutter create . --platforms=android --org=com.mayostudio
          
          # إضافة صلاحية الإنترنت والشبكة لملف AndroidManifest.xml
          python3 -c "
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f:
              data = f.read()
          permissions = '''
              <uses-permission android:name=\"android.permission.INTERNET\"/>
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>
          '''
          data = data.replace('<application', permissions + '\n    <application')
          with open(path, 'w') as f:
              f.write(data)
          "

          # ضبط التوقيع التلقائي لنسخة الـ release
          python3 -c "
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()
          if 'signingConfig signingConfigs.debug' not in content:
              content = content.replace('buildTypes {', 'buildTypes {\n        release {\n            signingConfig signingConfigs.debug\n        }')
          with open(path, 'w') as f:
              f.write(content)
          "

          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: installment-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
