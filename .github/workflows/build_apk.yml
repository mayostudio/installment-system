name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Locate and Build APK
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter pub get
            flutter build apk --release
          else
            TARGET_DIR=$(dirname $(find . -maxdepth 3 -name "pubspec.yaml" | head -n 1))
            echo "Found Flutter app in: $TARGET_DIR"
            cd "$TARGET_DIR"
            flutter pub get
            flutter build apk --release
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: installment-app-release
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
