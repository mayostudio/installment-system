name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Regenerate Clean Android Project & Build APK
        run: |
          # 1. إزالة مجلد الأندرويد القديم بالكامل لضمان التخلص من أي ملفات معطوبة
          rm -rf android/
          
          # 2. إنشاء بيئة أندرويد قياسية رسمية ومتوافقة مع أحدث Gradle و Kotlin
          flutter create . --platforms=android --org=com.mayostudio
          
          # 3. قبول التراخيص وجلب الحزم
          yes | flutter doctor --android-licenses || true
          flutter pub get
          
          # 4. بناء الـ APK للـ Release مباشرة
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: installment-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
